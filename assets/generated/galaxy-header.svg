<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d2338"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3A5"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="900" height="260" fill="url(#bgGlow)"/>

  <!-- left: name/title -->
  <text x="45" y="95" font-family="Fira Code, monospace" font-size="34" font-weight="700" fill="#f0f6fc">Devendra</text>
  <text x="45" y="122" font-family="Fira Code, monospace" font-size="14" fill="#7dd3fc">Infrastructure Engineer</text>
  <text x="45" y="144" font-family="Fira Code, monospace" font-size="13" fill="#94a3b8">Kubernetes · AWS · SRE</text>
  <rect x="45" y="158" width="180" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="45" y="190" font-family="Fira Code, monospace" font-size="12" fill="#4b6478">"Building systems that don't wake</text>
  <text x="45" y="207" font-family="Fira Code, monospace" font-size="12" fill="#4b6478">people up at 3am."</text>

  <!-- right: orbiting infra icons around a core node -->
  <g transform="translate(680,130)">
    <circle r="95" fill="none" stroke="#1a2b3c" stroke-width="1"/>
    <circle r="65" fill="none" stroke="#1a2b3c" stroke-width="1"/>
    <circle r="35" fill="none" stroke="#1a2b3c" stroke-width="1"/>

    <!-- core -->
    <circle r="10" fill="url(#accent)" filter="url(#glow)"/>

    <!-- orbit 1: K8s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
      <circle cx="35" cy="0" r="6" fill="#38BDF8"/>
      <text x="35" y="-12" font-family="Fira Code, monospace" font-size="9" fill="#7dd3fc" text-anchor="middle">K8s</text>
    </g>

    <!-- orbit 2: AWS -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="120 0 0" to="480 0 0" dur="20s" repeatCount="indefinite"/>
      <circle cx="65" cy="0" r="7" fill="#22D3A5"/>
      <text x="65" y="-14" font-family="Fira Code, monospace" font-size="9" fill="#5eead4" text-anchor="middle">AWS</text>
    </g>

    <!-- orbit 3: CI/CD -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="240 0 0" to="600 0 0" dur="26s" repeatCount="indefinite"/>
      <circle cx="95" cy="0" r="6" fill="#c4b5fd"/>
      <text x="95" y="-12" font-family="Fira Code, monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">CI/CD</text>
    </g>

    <!-- orbit 4: Prometheus -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="200 0 0" to="-160 0 0" dur="17s" repeatCount="indefinite"/>
      <circle cx="65" cy="0" r="5" fill="#fbbf24"/>
      <text x="65" y="14" font-family="Fira Code, monospace" font-size="9" fill="#fbbf24" text-anchor="middle">Prom</text>
    </g>
  </g>

  <!-- pulse ring around core -->
  <g transform="translate(680,130)">
    <circle r="10" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="10;30;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
