      <stop offset="50%" stop-color="#7dfaff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7dfaff" stop-opacity="0"/>
    </linearGradient>
  </defs>

<rect width="900" height="436" rx="10" fill="url(#bg3)" stroke="#1a2b3c" stroke-width="1"/>
