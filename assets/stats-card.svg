    <text x="478" y="128" font-size="12" fill="#94a3b8">uptime</text>

    <!-- block 4 -->
    <rect x="669" y="52" width="201" height="95" rx="8" fill="#0d1520" stroke="#1a2b3c"/>
    <rect x="669" y="52" width="4" height="95" rx="2" fill="url(#accent2)"/>
    <text x="691" y="90" font-size="20" font-weight="700" fill="#f0f6fc">IST</text>
