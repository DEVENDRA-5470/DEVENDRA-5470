<svg width="900" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3A5"/>
    </linearGradient>
  </defs>

  <rect width="900" height="170" rx="10" fill="url(#bg2)" stroke="#1a2b3c" stroke-width="1"/>

  <text x="30" y="34" font-family="Fira Code, monospace" font-size="13" fill="#4b6478">// mission telemetry</text>

  <!-- 4 stat blocks -->
