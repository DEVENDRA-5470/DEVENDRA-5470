    <!-- block 1 -->
    <rect x="30" y="52" width="195" height="95" rx="8" fill="#0d1520" stroke="#1a2b3c"/>
    <rect x="30" y="52" width="4" height="95" rx="2" fill="url(#accent2)"/>
    <text x="52" y="90" font-size="30" font-weight="700" fill="#f0f6fc">3.5+</text>
    <text x="52" y="112" font-size="12" fill="#94a3b8">years in</text>
    <text x="52" y="128" font-size="12" fill="#94a3b8">production infra</text>

    <!-- block 2 -->
    <rect x="243" y="52" width="195" height="95" rx="8" fill="#0d1520" stroke="#1a2b3c"/>
    <rect x="243" y="52" width="4" height="95" rx="2" fill="url(#accent2)"/>
    <text x="265" y="90" font-size="30" font-weight="700" fill="#f0f6fc">07</text>
