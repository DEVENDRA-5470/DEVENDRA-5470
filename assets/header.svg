<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="60%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a2332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3A5"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1a2b3c" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>
  <rect width="900" height="200" fill="url(#grid)" opacity="0.5"/>

  <!-- top status bar -->
  <rect x="0" y="0" width="900" height="34" fill="#0a0e14" opacity="0.7"/>
  <circle cx="24" cy="17" r="5" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="17" r="5" fill="#27c93f"/>
  <text x="850" y="22" text-anchor="end" font-family="Fira Code, monospace" font-size="12" fill="#4b6478">status: online</text>

  <!-- main content -->
  <text x="50" y="105" font-family="Fira Code, monospace" font-size="46" font-weight="700" fill="#f0f6fc">DEVENDRA</text>
  <text x="50" y="105" font-family="Fira Code, monospace" font-size="46" font-weight="700" fill="url(#accent)" opacity="0.15" filter="url(#glow)">DEVENDRA</text>

  <text x="52" y="135" font-family="Fira Code, monospace" font-size="15" fill="#7dd3fc">$ whoami</text>
  <text x="52" y="160" font-family="Fira Code, monospace" font-size="15" fill="#94a3b8">Infrastructure Engineer — Kubernetes · AWS · SRE</text>

  <!-- accent underline -->
  <rect x="50" y="172" width="220" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- right side decorative telemetry lines -->
  <g opacity="0.55">
    <polyline points="620,150 650,120 680,135 710,90 740,110 770,70 800,95 830,60"
      fill="none" stroke="#22D3A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="830" cy="60" r="4" fill="#22D3A5"/>
  </g>
  <text x="620" y="175" font-family="Fira Code, monospace" font-size="11" fill="#4b6478">uptime · 99.98%</text>
</svg>
