# Galaxy Profile README Configuration
# Customized for Devendra

# Your GitHub username (required)
username: DEVENDRA-5470

# Additional GitHub accounts to aggregate stats from (optional)
additional_accounts: []

# Organizations to track contributions to (optional)
organizations: []

# Profile information displayed in the galaxy header
profile:
  name: "Devendra"
  tagline: "Senior DevOps & SRE Engineer | Kubernetes · AWS · CI/CD | Prometheus · Grafana | Python"
  company: "Independent — Infra & DevOps Training"
  location: "Faridabad, India"
  bio: |
    Infrastructure engineer with 3.5+ years running production systems —
    designing and operating the Kubernetes, CI/CD, and observability stacks
    underneath them. Building self-managed K3s clusters with service mesh
    and GitOps delivery, and zero-trust, keyless CI/CD pipelines on AWS.
    Also delivers AWS, DevOps, and backend training to engineers.
  philosophy: '"Building systems that don''t wake people up at 3am."'

# Social links displayed at the bottom of the profile
social:
  email: "YOUR-EMAIL"
  linkedin: "YOUR-LINKEDIN-HANDLE"
  website: "https://blog.devilhai.info"

# Galaxy arms represent your core focus areas
# Available colors: "synapse_cyan", "dendrite_violet", "axon_amber"
galaxy_arms:
  - name: "Platform & Orchestration"
    color: "synapse_cyan"
    items:
      - "Kubernetes"
      - "K3s"
      - "Docker"
      - "Linkerd"
      - "Helm"

  - name: "Cloud & CI/CD"
    color: "dendrite_violet"
    items:
      - "AWS"
      - "Jenkins"
      - "GitHub Actions"
      - "ArgoCD"
      - "Terraform"

  - name: "Observability & Data"
    color: "axon_amber"
    items:
      - "Prometheus"
      - "Grafana"
      - "Python"
      - "MySQL"
      - "Redis"

# Featured projects shown as constellation stars
projects:
  - repo: "DEVENDRA-5470/bookvault"
    arm: 0
    description: "Self-managed 3-node K3s cluster with Linkerd service mesh and Jenkins + ArgoCD GitOps delivery."
  - repo: "DEVENDRA-5470/electronix"
    arm: 1
    description: "Distributed Jenkins CI/CD for a production MERN e-commerce app, zero hardcoded credentials."
  - repo: "DEVENDRA-5470/simplebank"
    arm: 1
    description: "Zero-SSH, keyless AWS-native CI/CD — OIDC auth, SSM Session Manager, no open SSH port."
  - repo: "DEVENDRA-5470/iquiz-hub"
    arm: 2
    description: "Production quiz platform on ECS Fargate with a proctored, anti-cheat coding-exam module."

# Theme color overrides (deep space palette, matches DevOps dark theme)
theme:
  void: "#080c14"
  nebula: "#0d1520"
  star_dust: "#1a2b3c"
  synapse_cyan: "#38BDF8"
  dendrite_violet: "#c4b5fd"
  axon_amber: "#22D3A5"
  text_bright: "#f0f6fc"
  text_dim: "#94a3b8"
  text_faint: "#4b6478"

# Stats configuration — which metrics to show on the telemetry card
stats:
  metrics:
    - "commits"
    - "repos"
    - "stars"
    - "prs"

# Language display settings
languages:
  exclude:
    - "HTML"
    - "CSS"
    - "Makefile"
  max_display: 12
  # Manual languages to add (useful for training/work repos not attributed to this GitHub account)
  manual:
    Python: 25000
    JavaScript: 14000
    Bash: 15000
    YAML: 12000
    Terraform: 10000
    Django: 9000
    Flask: 9000
    FastAPI: 8000
    React: 7000
    Groovy: 8000
    Dockerfile: 6000
